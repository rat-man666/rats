<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rat in a Cage</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 600px;
      background: #1e1e1e;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 24px;
      border-radius: 8px;
    }

    .quote {
      font-size: 1.5rem;
      font-weight: 600;
      font-style: italic;
      color: #e0e0e0;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Points to your uploaded image -->
    <img src="images.jpg" alt="Logo" class="logo">
    <p class="quote">"Despite all my rage, I am still just a rat in a cage"</p>
  </div>

</body>
</html>
